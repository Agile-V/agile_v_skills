aibom_schema_version: "0.2"
manifest_type: "agile-v-agent-run-bom"
identity:
  task_id: "AAV-0000"
  run_id: "RUN-0000"
  created_at: "2026-01-01T00:00:00Z"
  created_by: "agent-or-human"
  repository: "owner/repo"
risk:
  agile_v_risk_level: "L1" # Enum: L0, L1, L2, L3, L4
  ai_influence_level: "assistive" # Enum: none, assistive, substantial, critical
  regulated_context: false
  human_approval_required: false
models: []
agent_runtime:
  agent_name: "agent-name"
  agent_framework: "framework"
  execution_environment: "local" # Enum: local, ci, container, kubernetes, ide, saas, unknown
  confidence: "declared" # Enum: declared, inferred, verified, unresolved
agile_v_skills: []
tools: []
agent_interoperability:
  untrusted_context_enforced: null
  tool_records: [] # Paths to AGENT_TOOL_RECORD.yaml evidence
  delegation_records: [] # Paths to AGENT_DELEGATION_RECORD.yaml evidence
context:
  declared:
    instruction_bundles: []
    policies: []
    sources: []
    datasets: []
  observed:
    sources: []
    tool_calls_evidence: ""
    policy_decisions_evidence: ""
    confidence: "declared"
hashes: [] # Use sha256:<lowercase-hex>; omit unknown digests.
artifact_influence: []
security_and_privacy:
  secrets_redacted: true
  hidden_chain_of_thought_excluded: true
  pii_redacted: true
  prompt_capture_policy: "metadata_only" # Enum: metadata_only, redacted, full_allowed, not_captured
summary:
  unresolved_items: []
  verifier_notes: ""
  human_approval: "not_required" # Enum: not_required, required, approved, rejected, pending
