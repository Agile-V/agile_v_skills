# Qualification execution (example). See schemas/QUALIFICATION_EXECUTION.schema.json
# Record observable expected-vs-actual, not a bare PASS. Preserve FAIL/BLOCKED/INCONCLUSIVE.
# A WAIVED result requires an authorized waiver (approval_ref + rationale) — never self-issued.
schema_version: "1.0"
compatibility: additive
migration: none
fixture_owner: agile-v.org
execution:
  execution_id: "EXEC-OQ-0007-01"
  protocol_id: "OQ-0007"
  protocol_revision: "1"
  baseline_ref: "BASELINE-QUAL-0001"
  started_at: "2026-02-11T09:00:00Z"
  ended_at: "2026-02-11T09:30:00Z"
  executor:
    identity_ref: "identity-ref"
    role: "qualification-executor"
  witness:
    required: false
    identity_ref: null
  environment_ref: "GMP-VAL-01"
  test_case_results:
    - test_id: "TC-0042"
      result: "PASS"                 # NOT_RUN | PASS | FAIL | BLOCKED | INCONCLUSIVE | DEVIATION | WAIVED
      step_results:
        - step: 1
          actual: "Authenticated as QC_VIEWER"
          result: "PASS"
          evidence_refs: ["evidence/auth-log-0042.txt"]
        - step: 2
          actual: "HTTP 403; result remained REVIEWED; audit event AT-8891 created"
          result: "PASS"
          evidence_refs:
            - "evidence/request-response-0042.txt"
            - "evidence/audit-event-AT-8891.json"
      deviation_refs: []
  evidence_integrity:
    digest_algorithm: "sha256"
    evidence_digests: []
  review:
    status: "pending"                # pending | reviewed | approved | rejected
    reviewer_ref: null
