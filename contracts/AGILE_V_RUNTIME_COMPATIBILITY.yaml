# Skills <-> runtime compatibility declaration.
#
# `agile_v_skills` owns normative lifecycle/evidence/schema contracts.
# A runtime (e.g. `agentic_agile_v`) implements them. This file states which
# contract versions THIS repository publishes, and records what is known
# about runtime compatibility. It does not assert that any runtime actually
# enforces these contracts -- see docs/agile-v-runtime/07_EVIDENCE_ADMISSION_CONTRACT.md
# and the enforcement-class rule referenced there: a skill instruction is not
# the same claim as a runtime-enforced control.

skills_contract:
  # Informational: the repository release line this file was authored against.
  # Not machine-enforced against package.json (patch releases do not require
  # a contract-compatibility bump); bump this when a contract version above
  # changes, not on every release.
  repository_version_line: "3.9.x"
  lifecycle_contract: "1.0"
  evidence_bundle: "2.0"
  approval: "2.0"
  trace_graph: "1.0"
  gate_receipt: "1.0"
  exception_decision: "1.0"
  revalidation_assessment: "1.0"

# Known runtimes and what is actually verified about their support for the
# contracts above. Do not mark a capability supported without a source
# (a compatibility manifest published by that runtime, or a recorded
# integration test). An unverified claim must say so explicitly.
compatible_runtimes:
  agentic_agile_v:
    repository: "Agile-V/agentic_agile_v"
    # No compatibility manifest has been observed from this runtime as of the
    # authoring of this file. Do not report a minimum_version as verified.
    minimum_version: null
    verification_status: "unverified"
    required_capabilities:
      - fail_closed_gate_engine
      - evidence_state_binding
      - approval_binding
      - scope_enforcement
      - verifier_separation
    notes: >
      agentic_agile_v is a separate implementation repository under active
      hardening (see its own AGILE_V_REPOSITORY_IMPROVEMENT_SPEC.md). It does
      not yet publish a machine-readable compatibility manifest this file can
      check against. Treat every required_capability above as unconfirmed
      until that runtime publishes one and an integration test observes it.

# Generated/embedded skill copies elsewhere (e.g. a runtime vendoring this
# repository's SKILL.md files) MUST record their source, per this contract:
#   source_repository: Agile-V/agile_v_skills
#   source_commit: <sha>
#   skill_contract_version: <this file's skills_contract values at that commit>
# Do not manually maintain a second, independently drifting copy.
generated_copy_provenance_fields: ["source_repository", "source_commit", "skill_contract_version"]
