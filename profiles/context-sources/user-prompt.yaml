# Agile-V Context Source Profile -- policy-side artifact.
# See docs/agile-v-runtime/16_CONTEXT_TRUST_CONTRACT.md
schema_version: '1.0'
profile:
  id: CTX-USER-PROMPT
  source_class: user_prompt
  default_trust: untrusted_data
  may_influence:
  - implementation_context
  - candidate_requirement
  - candidate_test
  - issue_discovery
  - documentation_draft
  may_not_influence:
  - approved_requirement
  - risk_level
  - policy
  - approval
  - delegated_authority
  - evidence_source_profile
  - evidence_property_profile
  - gate_decision
  may_propose:
  - approved_requirement
  - risk_level
  - policy
  - evidence_source_profile
  - evidence_property_profile
  injection_sensitive: true
  owner: Agile-V
  notes: Chat/prompt input. User identity in a prompt is unauthenticated; approvals come only from authenticated
    approval records.
