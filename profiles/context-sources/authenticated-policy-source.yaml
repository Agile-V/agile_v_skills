# Agile-V Context Source Profile -- policy-side artifact.
# See docs/agile-v-runtime/16_CONTEXT_TRUST_CONTRACT.md
schema_version: '1.0'
profile:
  id: CTX-AUTHENTICATED-POLICY-SOURCE
  source_class: authenticated_policy_source
  default_trust: authoritative
  may_influence:
  - policy
  - risk_level
  - evidence_source_profile
  - evidence_property_profile
  - implementation_context
  may_not_influence:
  - approval
  - delegated_authority
  - gate_decision
  - approved_requirement
  may_propose: []
  injection_sensitive: false
  owner: Agile-V
  notes: Accepted control-plane policy store after authentication and change approval. Cannot itself approve,
    delegate or decide a gate.
