# Agile-V Evidence Source Profile -- policy-side artifact.
# Evidence producers MUST NOT edit this file within the task that uses it.
# See docs/agile-v-runtime/15_EVIDENCE_ADAPTER_REGISTRY.md
schema_version: '1.0'
compatibility: additive
migration: none
fixture_owner: Agile-V
adapter:
  adapter_id: EAD-k8s-aibom-v1
  adapter_version: '1'
  title: k8s-aibom runtime AI inventory
  status: experimental
  owner: Agile-V
  evidence_type: ai_inventory
  source_version_scope:
    tool: k8s-aibom
    format: CycloneDX ML-BOM output
    supported_versions: '*'
  may_establish:
  - observed_ai_component_inventory
  - inventory_confidence_level
  - workload_identity
  may_not_establish:
  - complete_inventory
  - human_authority
  - independent_verification
  - intended_use_validation
  - model_quality
  - organizational_independence
  - regulatory_compliance
  - safety
  - verified_model_identity
  minimum_evidence_locators:
  - bom_digest
  - cluster_ref
  - evidence_locator
  freshness:
    invalidated_by:
    - model
    - environment
    - tool
    max_age_days: null
  known_limitations:
  - Inventory entries keep their reported confidence; declared or inferred entries are never promoted
    to verified.
  - The tool observes running workloads only; components not deployed at scan time are not inventoried.
  references:
  - https://github.com/GoogleCloudPlatform/k8s-aibom
  supersedes: null
  superseded_by: null
  trust_boundary: cluster-read-only-scan
