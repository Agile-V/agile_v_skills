# Agile-V Evidence Source Profile -- policy-side artifact.
# Evidence producers MUST NOT edit this file within the task that uses it.
# See docs/agile-v-runtime/15_EVIDENCE_ADAPTER_REGISTRY.md
schema_version: '1.0'
compatibility: additive
migration: none
fixture_owner: Agile-V
adapter:
  adapter_id: EAD-github-actions-v1
  adapter_version: '1'
  title: GitHub Actions workflow run
  status: candidate
  owner: Agile-V
  evidence_type: ci_workflow_run
  source_version_scope:
    tool: GitHub Actions
    format: workflow run API record
    supported_versions: '*'
  may_establish:
  - workflow_execution
  - job_result
  - workflow_identity
  - commit_identity
  - artifact_reference
  - provenance
  may_not_establish:
  - human_authority
  - independent_verification
  - intended_use_validation
  - organizational_independence
  - regulatory_compliance
  - requirement_satisfaction_by_itself
  - semantic_correctness
  - test_result
  minimum_evidence_locators:
  - run_url
  - run_id
  - head_sha
  freshness:
    invalidated_by:
    - source
    - policy
    - tool
    max_age_days: null
  known_limitations:
  - A green workflow shows configured jobs succeeded; it does not show which assertions the jobs made.
  - Workflow definitions can be edited by repository writers; pin the workflow file digest in policy for
    L2+.
  references:
  - https://docs.github.com/en/rest/actions/workflow-runs
  supersedes: null
  superseded_by: null
  trust_boundary: hosted-ci-runner
