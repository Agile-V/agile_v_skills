# Agile-V Evidence Source Profile -- policy-side artifact.
# Evidence producers MUST NOT edit this file within the task that uses it.
# See docs/agile-v-runtime/15_EVIDENCE_ADAPTER_REGISTRY.md
schema_version: '1.0'
compatibility: additive
migration: none
fixture_owner: Agile-V
adapter:
  adapter_id: EAD-otel-genai-trace-v1
  adapter_version: '1'
  title: OpenTelemetry GenAI trace
  status: experimental
  owner: Agile-V
  evidence_type: telemetry_trace
  source_version_scope:
    tool: OpenTelemetry
    format: OTLP trace with gen_ai.* attributes
    supported_versions: '*'
  may_establish:
  - observed_model_identity
  - observed_operation
  - span_identity
  - execution_timestamp
  may_not_establish:
  - evidence_admission
  - human_authority
  - independent_verification
  - intended_use_validation
  - organizational_independence
  - regulatory_compliance
  - semantic_correctness
  - verified_model_identity
  minimum_evidence_locators:
  - trace_id
  - collector_ref
  freshness:
    invalidated_by:
    - model
    - tool
    - environment
    max_age_days: null
  known_limitations:
  - gen_ai.response.model is reported by the provider response; it is observed, not cryptographically
    verified.
  - Telemetry is observability; it never admits evidence by itself.
  references:
  - https://opentelemetry.io/docs/specs/semconv/gen-ai/
  supersedes: null
  superseded_by: null
  trust_boundary: telemetry-collector
