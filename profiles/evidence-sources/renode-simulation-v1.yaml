# Agile-V Evidence Source Profile -- policy-side artifact.
# Evidence producers MUST NOT edit this file within the task that uses it.
# See docs/agile-v-runtime/15_EVIDENCE_ADAPTER_REGISTRY.md
schema_version: '1.0'
compatibility: additive
migration: none
fixture_owner: Agile-V
adapter:
  adapter_id: EAD-renode-simulation-v1
  adapter_version: '1'
  title: Renode simulation run
  status: candidate
  owner: Agile-V
  evidence_type: simulation_result
  source_version_scope:
    tool: Renode
    format: Robot Framework results + trace
    supported_versions: '>=1.13'
  may_establish:
  - simulation_execution
  - simulation_target
  - observed_simulated_behavior
  - trace_reference
  - state_binding
  may_not_establish:
  - electrical_safety
  - emc
  - hil_execution
  - human_authority
  - independent_verification
  - intended_use_validation
  - organizational_independence
  - physical_hardware_behavior
  - physical_measurement
  - real_hil_success
  - regulatory_compliance
  minimum_evidence_locators:
  - results_digest
  - platform_description_digest
  - trace_uri
  freshness:
    invalidated_by:
    - source
    - tool
    - environment
    max_age_days: null
  known_limitations:
  - Simulated peripherals model a subset of real silicon behavior; timing fidelity is bounded.
  - Simulation results never substitute for hardware-in-the-loop evidence.
  references:
  - https://renode.readthedocs.io/en/latest/
  supersedes: null
  superseded_by: null
  trust_boundary: isolated-simulation-job
