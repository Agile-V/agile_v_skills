# Agile-V Evidence Source Profile -- policy-side artifact.
# Evidence producers MUST NOT edit this file within the task that uses it.
# See docs/agile-v-runtime/15_EVIDENCE_ADAPTER_REGISTRY.md
schema_version: '1.0'
compatibility: additive
migration: none
fixture_owner: Agile-V
adapter:
  adapter_id: EAD-pytest-junit-v1
  adapter_version: '1'
  title: pytest / JUnit XML test report
  status: candidate
  owner: Agile-V
  evidence_type: test_result
  source_version_scope:
    tool: pytest
    format: JUnit XML
    supported_versions: '>=7.0,<10.0'
  may_establish:
  - test_execution
  - test_result
  - test_case_identity
  - execution_timestamp
  - state_binding
  may_not_establish:
  - complete_security
  - human_authority
  - independent_verification
  - intended_use_validation
  - organizational_independence
  - physical_measurement
  - provenance
  - regulatory_compliance
  minimum_evidence_locators:
  - report_uri
  - report_digest
  freshness:
    invalidated_by:
    - source
    - requirement
    - environment
    - tool
    max_age_days: null
  known_limitations:
  - A passing report shows that collected tests passed; it does not show that the tests are adequate for
    the requirement.
  - JUnit XML has no native subject digest; state_binding relies on the runner recording the tested commit/build
    digest.
  references:
  - https://docs.pytest.org/en/stable/how-to/output.html#creating-junitxml-format-files
  supersedes: null
  superseded_by: null
  trust_boundary: isolated-test-job
