# Agile-V Evidence Source Profile -- policy-side artifact.
# Evidence producers MUST NOT edit this file within the task that uses it.
# See docs/agile-v-runtime/15_EVIDENCE_ADAPTER_REGISTRY.md
schema_version: '1.0'
compatibility: additive
migration: none
fixture_owner: Agile-V
adapter:
  adapter_id: EAD-agent-session-metadata-v1
  adapter_version: '1'
  title: Agent runtime session metadata
  status: experimental
  owner: Agile-V
  evidence_type: ai_run_metadata
  source_version_scope:
    tool: Agent runtime
    format: session export / AI_RUN_MANIFEST observed block
    supported_versions: '*'
  may_establish:
  - declared_model_identity
  - declared_runtime_identity
  - session_identity
  - tool_access_record
  may_not_establish:
  - hidden_reasoning_capture
  - human_authority
  - independent_verification
  - intended_use_validation
  - organizational_independence
  - regulatory_compliance
  - semantic_correctness
  - verified_model_identity
  minimum_evidence_locators:
  - session_ref
  - manifest_digest
  freshness:
    invalidated_by:
    - model
    - tool
    max_age_days: null
  known_limitations:
  - Model and runtime identity reported by the agent client are declarations unless confirmed by an independent
    observed source.
  references:
  - https://agentskills.io/specification
  supersedes: null
  superseded_by: null
  trust_boundary: agent-client
