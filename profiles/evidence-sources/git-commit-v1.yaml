# Agile-V Evidence Source Profile -- policy-side artifact.
# Evidence producers MUST NOT edit this file within the task that uses it.
# See docs/agile-v-runtime/15_EVIDENCE_ADAPTER_REGISTRY.md
schema_version: '1.0'
compatibility: additive
migration: none
fixture_owner: Agile-V
adapter:
  adapter_id: EAD-git-commit-v1
  adapter_version: '1'
  title: Git commit identity
  status: candidate
  owner: Agile-V
  evidence_type: source_identity
  source_version_scope:
    tool: Git
    format: commit object
    supported_versions: '*'
  may_establish:
  - commit_identity
  - state_binding
  may_not_establish:
  - human_authority
  - independent_verification
  - intended_use_validation
  - organizational_independence
  - provenance
  - regulatory_compliance
  - semantic_correctness
  - signer_identity
  minimum_evidence_locators:
  - repository
  - commit_sha
  freshness:
    invalidated_by:
    - source
    max_age_days: null
  known_limitations:
  - SHA-1 object ids are weaker than SHA-256 digests; bind a tree or archive digest for L3+.
  - Commit author fields are unauthenticated unless the commit signature is separately verified.
  references:
  - https://git-scm.com/book/en/v2/Git-Internals-Git-Objects
  supersedes: null
  superseded_by: null
  trust_boundary: repository-read
