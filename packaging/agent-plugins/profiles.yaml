# Agent Plugins 1.0 distribution profiles (source of truth for generated packages).
# Packages are generated by tools/build_agent_plugins.py from the canonical skill
# directories listed in catalog/skills.json; no skill is copied by hand.
# Stable channels MUST NOT include a skill whose catalog status is draft.
schema_version: "1.0"
agent_plugins_spec: "1.0.0"
profiles:
  - name: agile-v-core
    channel: stable
    description: "Agile-V foundation: lifecycle principles, formal requirements and ambiguity gatekeeping."
    include:
      - agile-v-core
      - requirement-architect
      - logic-gatekeeper

  - name: agile-v-verified-build
    channel: stable
    description: "Agile-V verified engineering lifecycle: requirements, build, independent test design and Red Team verification."
    include:
      - agile-v-core
      - requirement-architect
      - logic-gatekeeper
      - build-agent
      - test-designer
      - red-team-verifier
      - agile-v-quality-gates

  - name: agile-v-regulated
    channel: stable
    description: "Agile-V regulated delivery: verified build plus released compliance, safety, security, validation, audit, release and observability skills."
    include:
      - agile-v-core
      - requirement-architect
      - logic-gatekeeper
      - build-agent
      - test-designer
      - red-team-verifier
      - agile-v-quality-gates
      - agile-v-compliance
      - agile-v-control-matrix
      - compliance-auditor
      - validation-agent
      - safety-engineer
      - threat-modeler
      - release-manager
      - observability-planner

  - name: agile-v-embedded
    channel: stable
    description: "Agile-V embedded/firmware and hardware design skills. Packaging does not claim PCB or firmware assurance."
    include:
      - agile-v-core
      - agile-v-behavioral
      - requirement-architect
      - logic-gatekeeper
      - build-agent
      - build-agent-embedded
      - test-designer
      - red-team-verifier
      - safety-engineer
      - schematic-generator
      - agile-v-quality-gates

  - name: agile-v-regulated-preview
    channel: preview
    description: "PREVIEW: agile-v-regulated plus draft AI-BOM, Human Oversight and GxP Qualification skills. Requires local review before operational use."
    extends: agile-v-regulated
    include:
      - agile-v-aibom
      - agile-v-human-oversight
      - agile-v-gxp-qualification
